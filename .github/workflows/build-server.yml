name: Server build
on:
  workflow_dispatch:
  push:
    paths:
      - 'Server/**'
      - '.github/workflows/build-server.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Server/MMORPG.Server.csproj --configuration Release
