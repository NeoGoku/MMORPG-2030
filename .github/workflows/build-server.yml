name: Server build
on:
  workflow_dispatch:
  pull_request:
    paths: ['Server/**', 'Server.Tests/**', 'Client/data/**', 'tests/**', '.github/workflows/build-server.yml']
  push:
    branches: [main]
    paths: ['Server/**', 'Server.Tests/**', 'Client/data/**', 'tests/**', '.github/workflows/build-server.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mmorpg
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mmorpg"
          --health-interval 5s --health-retries 10
    env:
      MMORPG_TEST_DATABASE: Host=localhost;Port=5432;Database=mmorpg;Username=postgres;Password=ephemeral-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - run: dotnet build Server/MMORPG.Server.csproj --configuration Release
      - run: dotnet run --project Server.Tests --configuration Release -- Client/data/district.json
      - name: Real WebSocket integration
        shell: bash
        run: |
          set -euo pipefail
          MMORPG_ALLOW_GUEST=true dotnet Server/bin/Release/net8.0/MMORPG.Server.dll --urls http://127.0.0.1:5080 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5080/health; then break; fi
            sleep 1
          done
          python tests/multiplayer.py
      - name: Authenticated PostgreSQL reconnect integration
        shell: bash
        run: |
          set -euo pipefail
          MMORPG_DATABASE="$MMORPG_TEST_DATABASE" dotnet Server/bin/Release/net8.0/MMORPG.Server.dll --urls http://127.0.0.1:5081 > auth-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5081/health; then break; fi
            sleep 1
          done
          python tests/accounts.py
          python tests/social.py
          python tests/m5_network.py
      - name: Isolated PostgreSQL backup restore drill
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ephemeral-ci-only
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --dbname=mmorpg --format=custom > world.dump
          bash ops/restore-isolated.sh world.dump mmorpg_restore_ci
          for database in mmorpg mmorpg_restore_ci; do
            psql --dbname="$database" --tuples-only --no-align --set=ON_ERROR_STOP=1 -c "SELECT 'character:' || id || ':' || md5(document::text) FROM characters UNION ALL SELECT 'world:' || id::text || ':' || md5(document::text) FROM shared_world ORDER BY 1" > "$database.fingerprint"
          done
          diff -u mmorpg.fingerprint mmorpg_restore_ci.fingerprint
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-log
          path: |
            server.log
            auth-server.log
